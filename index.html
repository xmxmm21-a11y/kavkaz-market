<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Kavkaz Market</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #171717;
      padding-bottom: 90px;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 18px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .location {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .search {
      width: 100%;
      border: none;
      outline: none;
      background: #f1f1f1;
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 16px;
    }

    .content {
      padding: 16px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 750;
      margin: 8px 0 14px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .category {
      min-width: 82px;
      background: white;
      border-radius: 15px;
      padding: 12px 8px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.04);
    }

    .category-icon {
      font-size: 27px;
      margin-bottom: 5px;
    }

    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .product {
      background: white;
      border-radius: 17px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .product-image {
      height: 145px;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .favorite {
      position: absolute;
      right: 9px;
      top: 9px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      font-size: 18px;
    }

    .product-info {
      padding: 11px;
    }

    .product-title {
      font-size: 15px;
      font-weight: 650;
      margin-bottom: 7px;
    }

    .price {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .city {
      color: #888;
      font-size: 12px;
    }

    .add-button {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 568px;
      border: none;
      border-radius: 16px;
      padding: 15px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 700;
      z-index: 20;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #e8e8e8;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 30;
    }

    .nav-item {
      border: none;
      background: none;
      color: #777;
      font-size: 11px;
      text-align: center;
    }

    .nav-item.active {
      color: #111;
      font-weight: 700;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #888;
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">Kavkaz Market</div>

    <div class="location">
      📍 Хасавюрт
    </div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Поиск товаров..."
    >
  </header>

  <main class="content">

    <div class="section-title">Категории</div>

    <div class="categories">
      <div class="category" onclick="filterCategory('Одежда')">
        <div class="category-icon">👕</div>
        Одежда
      </div>

      <div class="category" onclick="filterCategory('Обувь')">
        <div class="category-icon">👟</div>
        Обувь
      </div>

      <div class="category" onclick="filterCategory('Телефоны')">
        <div class="category-icon">📱</div>
        Телефоны
      </div>

      <div class="category" onclick="filterCategory('Авто')">
        <div class="category-icon">🚗</div>
        Авто
      </div>

      <div class="category" onclick="filterCategory('Дом')">
        <div class="category-icon">🏠</div>
        Дом
      </div>

      <div class="category" onclick="filterCategory('Другое')">
        <div class="category-icon">📦</div>
        Другое
      </div>
    </div>

    <div class="section-title">Новые объявления</div>

    <div id="products" class="products">

      <div class="product" data-category="Одежда" data-name="Мужская куртка">
        <div class="product-image">🧥</div>

        <button class="favorite" onclick="favorite(event, this)">
          ♡
        </button>

        <div class="product-info">
          <div class="product-title">Мужская куртка</div>
          <div class="price">5 000 ₽</div>
          <div class="city">Хасавюрт</div>
        </div>
      </div>

      <div class="product" data-category="Телефоны" data-name="iPhone 15 Pro">
        <div class="product-image">📱</div>

        <button class="favorite" onclick="favorite(event, this)">
          ♡
        </button>

        <div class="product-info">
          <div class="product-title">iPhone 15 Pro</div>
          <div class="price">65 000 ₽</div>
          <div class="city">Хасавюрт</div>
        </div>
      </div>

      <div class="product" data-category="Обувь" data-name="Кроссовки Nike">
        <div class="product-image">👟</div>

        <button class="favorite" onclick="favorite(event, this)">
          ♡
        </button>

        <div class="product-info">
          <div class="product-title">Кроссовки Nike</div>
          <div class="price">8 000 ₽</div>
          <div class="city">Хасавюрт</div>
        </div>
      </div>

      <div class="product" data-category="Авто" data-name="Toyota Camry">
        <div class="product-image">🚗</div>

        <button class="favorite" onclick="favorite(event, this)">
          ♡
        </button>

        <div class="product-info">
          <div class="product-title">Toyota Camry</div>
          <div class="price">2 100 000 ₽</div>
          <div class="city">Хасавюрт</div>
        </div>
      </div>

    </div>

    <div id="empty" class="empty">
      Ничего не найдено
    </div>

  </main>

</div>

<button class="add-button" onclick="addListing()">
  ＋ Разместить объявление
</button>

<nav class="bottom-nav">

  <button class="nav-item active" onclick="goHome()">
    <span class="nav-icon">🏠</span>
    Главная
  </button>

  <button class="nav-item" onclick="showFavorites()">
    <span class="nav-icon">♡</span>
    Избранное
  </button>

  <button class="nav-item" onclick="showProfile()">
    <span class="nav-icon">👤</span>
    Профиль
  </button>

</nav>

<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  function favorite(event, button) {
    event.stopPropagation();

    if (button.textContent.trim() === "♡") {
      button.textContent = "♥";
    } else {
      button.textContent = "♡";
    }
  }

  function addListing() {
    tg.showAlert(
      "Размещение объявления\n\nЭта функция будет добавлена следующим этапом."
    );
  }

  function showFavorites() {
    tg.showAlert(
      "Избранное\n\nЗдесь будут отображаться сохранённые товары."
    );
  }

  function showProfile() {
    const user = tg.initDataUnsafe?.user;

    let name = "Пользователь";

    if (user) {
      name = user.first_name || "Пользователь";
    }

    tg.showAlert(
      "👤 Профиль\n\nПривет, " + name + "!\n\nЗдесь появятся ваши объявления."
    );
  }

  function goHome() {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function filterCategory(category) {

    const products = document.querySelectorAll(".product");
    let found = 0;

    products.forEach(product => {

      if (product.dataset.category === category) {
        product.style.display = "block";
        found++;
      } else {
        product.style.display = "none";
      }

    });

    document.getElementById("empty").style.display =
      found === 0 ? "block" : "none";
  }

  const search = document.getElementById("search");

  search.addEventListener("input", function () {

    const query = this.value.toLowerCase().trim();

    const products = document.querySelectorAll(".product");
    let found = 0;

    products.forEach(product => {

      const name = product.dataset.name.toLowerCase();
      const category = product.dataset.category.toLowerCase();

      if (
        name.includes(query) ||
        category.includes(query)
      ) {
        product.style.display = "block";
        found++;
      } else {
        product.style.display = "none";
      }

    });

    document.getElementById("empty").style.display =
      found === 0 ? "block" : "none";

  });

</script>

</body>
</html>
